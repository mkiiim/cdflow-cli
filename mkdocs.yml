site_name: cdflow CLI Docs

# Hooks for automatic file syncing
hooks:
  - mkdocs_hooks.py

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: black

extra_css:
  - css/typography.css

markdown_extensions:
  - fenced_code
  - codehilite
  - pymdownx.superfences
  - admonition
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Usage & Config:
      - Usage Guide: usage.md
      - Configuration: configuration.md
      - Data Formats: data_formats.md
      - Plugins:
          - Overview: plugins/overview.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Legal:
      - License: license.md
      - CLA: cla.md
